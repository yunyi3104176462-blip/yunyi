<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 射击游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Microsoft YaHei', sans-serif; touch-action: none; }
  canvas { display: block; }

  /* 准星 */
  #crosshair {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 20px;
    pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #0f0;
    box-shadow: 0 0 4px #0f0;
  }
  #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 10px 12px; display: flex; justify-content: space-between;
    color: #fff; font-size: 14px; text-shadow: 0 0 4px #000;
    pointer-events: none; z-index: 10;
  }
  #hud .stat { background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }
  #health-bar { width: 100px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 3px; }
  #health-fill { height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
  #score { font-size: 22px; color: #0f0; font-weight: bold; }
  #ammo { font-size: 18px; }

  /* 伤害闪屏 */
  #damage-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.5));
    opacity: 0; pointer-events: none; z-index: 9; transition: opacity 0.2s;
  }

  /* 开始/结束界面 */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.88); z-index: 30; color: #fff;
    padding: 20px; text-align: center; overflow-y: auto;
  }
  .overlay h1 { font-size: 36px; margin-bottom: 8px; color: #0f0; text-shadow: 0 0 16px #0f0; }
  .overlay h2 { font-size: 28px; margin-bottom: 16px; color: #f44; }
  .overlay p { font-size: 14px; margin: 4px 0; color: #ccc; line-height: 1.6; }
  .overlay .controls { margin: 16px 0; padding: 14px 18px; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); max-width: 340px; }
  .overlay button {
    margin-top: 16px; padding: 14px 40px; font-size: 20px;
    background: #0a0; color: #fff; border: none; border-radius: 10px;
    cursor: pointer; font-family: inherit; font-weight: bold;
  }
  .overlay button:active { background: #0d0; transform: scale(0.97); }
  .hidden { display: none !important; }

  /* 击杀提示 */
  #kill-feed {
    position: fixed; top: 70px; right: 10px; z-index: 10;
    display: flex; flex-direction: column; gap: 4px; pointer-events: none;
  }
  .kill-msg {
    background: rgba(255,50,50,0.7); color: #fff; padding: 4px 10px;
    border-radius: 5px; font-size: 12px; animation: fadeOut 2s forwards;
  }
  @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateX(30px); } }

  /* ========== 手机端触控 ========== */
  #mobile-controls {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    display: none;
  }
  body.is-mobile #mobile-controls { display: block; }

  /* 虚拟摇杆 */
  #joystick-base {
    position: absolute; left: 30px; bottom: 40px;
    width: 110px; height: 110px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
  }
  #joystick-stick {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 48px; height: 48px;
    background: rgba(0,255,100,0.4);
    border: 2px solid rgba(0,255,100,0.7);
    border-radius: 50%;
    transition: none;
  }

  /* 视角滑动区域 */
  #look-area {
    position: absolute; right: 0; top: 0;
    width: 55%; height: 65%;
    pointer-events: auto;
    touch-action: none;
  }

  /* 操作按钮 */
  .ctrl-btn {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 14px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .ctrl-btn:active, .ctrl-btn.active {
    background: rgba(0,255,100,0.35);
    border-color: rgba(0,255,100,0.7);
  }
  #btn-shoot {
    right: 30px; bottom: 40px;
    width: 80px; height: 80px;
    font-size: 28px;
    background: rgba(255,50,50,0.25);
    border-color: rgba(255,80,80,0.6);
  }
  #btn-shoot:active { background: rgba(255,50,50,0.5); }
  #btn-reload {
    right: 125px; bottom: 70px;
    width: 56px; height: 56px;
    font-size: 12px;
  }
  #btn-jump {
    right: 125px; bottom: 135px;
    width: 56px; height: 56px;
    font-size: 20px;
  }
  #btn-run {
    left: 155px; bottom: 70px;
    width: 56px; height: 56px;
    font-size: 11px;
  }

  /* 桌面端提示 */
  #desktop-hint { display: block; }
  body.is-mobile #desktop-hint { display: none; }
  #mobile-hint { display: none; }
  body.is-mobile #mobile-hint { display: block; }

  @media (min-width: 768px) {
    #hud { font-size: 18px; padding: 16px 24px; }
    #health-bar { width: 160px; height: 14px; }
    #score { font-size: 28px; }
    .overlay h1 { font-size: 56px; }
    .overlay p { font-size: 18px; }
  }
</style>
</head>
<body>

<div id="crosshair" class="hidden"></div>
<div id="damage-overlay"></div>

<div id="hud" class="hidden">
  <div class="stat">
    <div>❤️ 生命</div>
    <div id="health-bar"><div id="health-fill" style="width:100%"></div></div>
  </div>
  <div class="stat" style="text-align:center">
    <div>🎯 得分</div>
    <div id="score">0</div>
  </div>
  <div class="stat" style="text-align:right">
    <div>🔫 弹药</div>
    <div id="ammo">30/30</div>
  </div>
</div>

<div id="kill-feed"></div>

<!-- 手机端触控 -->
<div id="mobile-controls">
  <div id="look-area"></div>
  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>
  <div class="ctrl-btn" id="btn-shoot">🔥</div>
  <div class="ctrl-btn" id="btn-reload">换弹</div>
  <div class="ctrl-btn" id="btn-jump">⬆</div>
  <div class="ctrl-btn" id="btn-run">奔跑</div>
</div>

<!-- 开始界面 -->
<div id="start-screen" class="overlay">
  <h1>🔫 3D 射击游戏</h1>
  <p>在竞技场中生存，消灭所有敌人！</p>
  <div class="controls" id="desktop-hint">
    <p><b>W A S D</b> — 移动</p>
    <p><b>鼠标</b> — 转动视角</p>
    <p><b>左键</b> — 射击</p>
    <p><b>R</b> — 换弹 &nbsp; <b>Shift</b> — 奔跑 &nbsp; <b>空格</b> — 跳跃</p>
  </div>
  <div class="controls" id="mobile-hint">
    <p>📱 <b>左侧摇杆</b> — 移动</p>
    <p>👆 <b>右侧滑动</b> — 转动视角</p>
    <p>🔥 <b>红色按钮</b> — 射击</p>
    <p>🔄 换弹 &nbsp; ⬆ 跳跃 &nbsp; 🏃 奔跑</p>
  </div>
  <button id="start-btn">开始游戏</button>
</div>

<!-- 结束界面 -->
<div id="game-over-screen" class="overlay hidden">
  <h2>💀 游戏结束</h2>
  <p style="font-size:20px">最终得分：<span id="final-score" style="color:#0f0;font-size:28px">0</span></p>
  <p>击杀敌人：<span id="final-kills">0</span></p>
  <button id="restart-btn">再来一局</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// 检测移动设备
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
  || ('ontouchstart' in window && window.innerWidth < 900);
if (isMobile) document.body.classList.add('is-mobile');

// ============ 游戏状态 ============
let scene, camera, renderer, clock;
let player = { velocity: new THREE.Vector3(), onGround: true, health: 100, score: 0, ammo: 30, maxAmmo: 30, reloading: false };
let keys = {};
let enemies = [];
let bullets = [];
let obstacles = [];
let gameRunning = false;
let kills = 0;
let lastShot = 0;
const shootCooldown = 120;
const arenaSize = 60;
const gunMesh = new THREE.Group();
let muzzleFlash;

// 手机端触控状态
let joystick = { active: false, dx: 0, dy: 0, touchId: null };
let lookTouch = { active: false, lastX: 0, lastY: 0, touchId: null };
let mobileRun = false;

// ============ 初始化 ============
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  scene.fog = new THREE.Fog(0x1a1a2e, 25, 70);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 0);

  renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
  renderer.shadowMap.enabled = !isMobile;
  if (!isMobile) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // 灯光
  scene.add(new THREE.AmbientLight(0x404060, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(20, 40, 20);
  if (!isMobile) {
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.left = -40; dirLight.shadow.camera.right = 40;
    dirLight.shadow.camera.top = 40; dirLight.shadow.camera.bottom = -40;
  }
  scene.add(dirLight);

  // 地面
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(arenaSize * 2, arenaSize * 2),
    new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = !isMobile;
  scene.add(ground);

  const grid = new THREE.GridHelper(arenaSize * 2, 40, 0x00ff88, 0x004422);
  grid.position.y = 0.01;
  scene.add(grid);

  createWalls();
  createObstacles();
  createGun();

  // 桌面端事件
  window.addEventListener('resize', onResize);
  if (!isMobile) {
    document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') reload(); });
    document.addEventListener('keyup', e => { keys[e.code] = false; });
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mousedown', e => { if (e.button === 0) shoot(); });
  }

  // 手机端触控
  if (isMobile) setupMobileControls();
}

function setupMobileControls() {
  const base = document.getElementById('joystick-base');
  const stick = document.getElementById('joystick-stick');
  const lookArea = document.getElementById('look-area');
  const maxR = 38;

  // 摇杆
  base.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joystick.active = true;
    joystick.touchId = t.identifier;
    updateJoystick(t.clientX, t.clientY);
  }, { passive: false });

  base.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joystick.touchId) updateJoystick(t.clientX, t.clientY);
    }
  }, { passive: false });

  base.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joystick.touchId) {
        joystick.active = false; joystick.dx = 0; joystick.dy = 0;
        stick.style.transform = 'translate(-50%, -50%)';
      }
    }
  });

  function updateJoystick(cx, cy) {
    const rect = base.getBoundingClientRect();
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    let dx = cx - ox, dy = cy - oy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
    joystick.dx = dx / maxR;
    joystick.dy = dy / maxR;
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  // 视角滑动
  lookArea.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    lookTouch.active = true;
    lookTouch.touchId = t.identifier;
    lookTouch.lastX = t.clientX;
    lookTouch.lastY = t.clientY;
  }, { passive: false });

  lookArea.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouch.touchId) {
        const dx = t.clientX - lookTouch.lastX;
        const dy = t.clientY - lookTouch.lastY;
        lookTouch.lastX = t.clientX;
        lookTouch.lastY = t.clientY;
        rotateView(dx, dy);
      }
    }
  }, { passive: false });

  lookArea.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouch.touchId) lookTouch.active = false;
    }
  });

  // 按钮
  const shootBtn = document.getElementById('btn-shoot');
  shootBtn.addEventListener('touchstart', e => { e.preventDefault(); shoot(); }, { passive: false });

  document.getElementById('btn-reload').addEventListener('touchstart', e => { e.preventDefault(); reload(); }, { passive: false });

  const jumpBtn = document.getElementById('btn-jump');
  jumpBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    keys['Space'] = true;
    jumpBtn.classList.add('active');
  }, { passive: false });
  jumpBtn.addEventListener('touchend', e => {
    e.preventDefault();
    keys['Space'] = false;
    jumpBtn.classList.remove('active');
  });

  const runBtn = document.getElementById('btn-run');
  runBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    mobileRun = true;
    runBtn.classList.add('active');
  }, { passive: false });
  runBtn.addEventListener('touchend', e => {
    e.preventDefault();
    mobileRun = false;
    runBtn.classList.remove('active');
  });

  // 防止双击缩放
  document.addEventListener('gesturestart', e => e.preventDefault());
}

function rotateView(dx, dy) {
  const sensitivity = 0.005;
  yaw -= dx * sensitivity;
  pitch -= dy * sensitivity;
  pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

function createWalls() {
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a5e, roughness: 0.8 });
  const wallH = 6, wallT = 1;
  const walls = [
    { w: arenaSize * 2, h: wallH, d: wallT, x: 0, z: -arenaSize },
    { w: arenaSize * 2, h: wallH, d: wallT, x: 0, z: arenaSize },
    { w: wallT, h: wallH, d: arenaSize * 2, x: -arenaSize, z: 0 },
    { w: wallT, h: wallH, d: arenaSize * 2, x: arenaSize, z: 0 },
  ];
  walls.forEach(w => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, w.h, w.d), wallMat);
    mesh.position.set(w.x, w.h / 2, w.z);
    if (!isMobile) { mesh.castShadow = true; mesh.receiveShadow = true; }
    scene.add(mesh);
    obstacles.push({ minX: w.x - w.w/2, maxX: w.x + w.w/2, minZ: w.z - w.d/2, maxZ: w.z + w.d/2 });
  });
}

function createObstacles() {
  const obsMat = new THREE.MeshStandardMaterial({ color: 0x4a4a6e, roughness: 0.7, metalness: 0.2 });
  const positions = [
    { x: -15, z: -15, w: 4, h: 3, d: 4 },
    { x: 15, z: -15, w: 5, h: 2.5, d: 3 },
    { x: -15, z: 15, w: 3, h: 4, d: 5 },
    { x: 15, z: 15, w: 4, h: 3.5, d: 4 },
    { x: 0, z: -25, w: 8, h: 2, d: 2 },
    { x: 0, z: 25, w: 8, h: 2, d: 2 },
    { x: -25, z: 0, w: 2, h: 2, d: 8 },
    { x: 25, z: 0, w: 2, h: 2, d: 8 },
    { x: -8, z: 0, w: 3, h: 2.5, d: 3 },
    { x: 8, z: 0, w: 3, h: 2.5, d: 3 },
  ];
  positions.forEach(p => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(p.w, p.h, p.d), obsMat);
    mesh.position.set(p.x, p.h / 2, p.z);
    if (!isMobile) { mesh.castShadow = true; mesh.receiveShadow = true; }
    scene.add(mesh);
    obstacles.push({ minX: p.x - p.w/2, maxX: p.x + p.w/2, minZ: p.z - p.d/2, maxZ: p.z + p.d/2 });
  });
}

function createGun() {
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222, metalness: 0.8, roughness: 0.3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.35), bodyMat);
  body.position.set(0, 0, -0.1);
  gunMesh.add(body);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.25, 8), bodyMat);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.02, -0.35);
  gunMesh.add(barrel);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.08), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  grip.position.set(0, -0.1, 0.02);
  grip.rotation.x = 0.3;
  gunMesh.add(grip);
  muzzleFlash = new THREE.PointLight(0xff6600, 0, 5);
  muzzleFlash.position.set(0, 0.02, -0.5);
  gunMesh.add(muzzleFlash);
  gunMesh.position.set(0.25, -0.2, -0.5);
  camera.add(gunMesh);
  scene.add(camera);
}

function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 25 + Math.random() * 15;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  const enemyGroup = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc2222, emissive: 0x440000, roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat);
  body.position.y = 0.9;
  enemyGroup.add(body);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), bodyMat);
  head.position.y = 1.75;
  enemyGroup.add(head);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.05), eyeMat);
  eye1.position.set(-0.12, 1.8, 0.26);
  enemyGroup.add(eye1);
  const eye2 = eye1.clone();
  eye2.position.x = 0.12;
  enemyGroup.add(eye2);
  enemyGroup.position.set(x, 0, z);
  scene.add(enemyGroup);
  enemies.push({
    mesh: enemyGroup, health: 3, speed: 2.5 + Math.random() * 1.5,
    lastAttack: 0, attackCooldown: 1200
  });
}

function shoot() {
  if (!gameRunning || player.reloading) return;
  const now = performance.now();
  if (now - lastShot < shootCooldown) return;
  if (player.ammo <= 0) { reload(); return; }
  lastShot = now;
  player.ammo--;
  updateHUD();
  muzzleFlash.intensity = 3;
  setTimeout(() => muzzleFlash.intensity = 0, 50);
  gunMesh.position.z = -0.45;
  setTimeout(() => gunMesh.position.z = -0.5, 60);

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  raycaster.far = 80;
  const enemyMeshes = enemies.map(e => e.mesh);
  const intersects = raycaster.intersectObjects(enemyMeshes, true);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const bullet = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, 0.4, 4),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );
  bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(1));
  bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  scene.add(bullet);
  bullets.push({ mesh: bullet, dir: dir.clone(), life: 0.5 });

  if (intersects.length > 0) {
    const hit = intersects[0];
    let enemyObj = null;
    for (const e of enemies) {
      if (hit.object === e.mesh || e.mesh.children.includes(hit.object)) { enemyObj = e; break; }
    }
    if (enemyObj) {
      enemyObj.health--;
      enemyObj.mesh.traverse(c => {
        if (c.isMesh && c.material.emissive) {
          c.material.emissive.setHex(0xffffff);
          setTimeout(() => c.material.emissive.setHex(0x440000), 100);
        }
      });
      if (enemyObj.health <= 0) killEnemy(enemyObj);
    }
  }
}

function killEnemy(enemy) {
  scene.remove(enemy.mesh);
  enemies = enemies.filter(e => e !== enemy);
  player.score += 100;
  kills++;
  updateHUD();
  showKillFeed('击杀 +100');
  const explosion = new THREE.PointLight(0xff4400, 4, 6);
  explosion.position.copy(enemy.mesh.position);
  explosion.position.y = 1;
  scene.add(explosion);
  setTimeout(() => scene.remove(explosion), 200);
  if (kills % 5 === 0 && enemies.length < 12) { spawnEnemy(); spawnEnemy(); }
}

function reload() {
  if (player.reloading || player.ammo === player.maxAmmo || !gameRunning) return;
  player.reloading = true;
  document.getElementById('ammo').textContent = '换弹..';
  setTimeout(() => {
    player.ammo = player.maxAmmo;
    player.reloading = false;
    updateHUD();
  }, 1500);
}

function updateEnemies(dt) {
  const now = performance.now();
  enemies.forEach(enemy => {
    const dir = new THREE.Vector3().subVectors(camera.position, enemy.mesh.position);
    dir.y = 0;
    const dist = dir.length();
    dir.normalize();
    if (dist > 2) enemy.mesh.position.add(dir.multiplyScalar(enemy.speed * dt));
    enemy.mesh.lookAt(camera.position.x, enemy.mesh.position.y, camera.position.z);
    enemy.mesh.position.x = Math.max(-arenaSize + 2, Math.min(arenaSize - 2, enemy.mesh.position.x));
    enemy.mesh.position.z = Math.max(-arenaSize + 2, Math.min(arenaSize - 2, enemy.mesh.position.z));
    if (dist < 2.5 && now - enemy.lastAttack > enemy.attackCooldown) {
      enemy.lastAttack = now;
      damagePlayer(10);
    }
    enemy.mesh.position.y = Math.sin(now * 0.003 + enemy.mesh.position.x) * 0.1;
  });
}

function damagePlayer(amount) {
  player.health -= amount;
  updateHUD();
  const overlay = document.getElementById('damage-overlay');
  overlay.style.opacity = '1';
  setTimeout(() => overlay.style.opacity = '0', 200);
  if (player.health <= 0) gameOver();
}

function updatePlayer(dt) {
  let fwd = 0, strafe = 0;
  if (isMobile) {
    // 摇杆：dy 向上为负（手指上推=前进）
    fwd = -joystick.dy;
    strafe = joystick.dx;
  } else {
    if (keys['KeyW']) fwd += 1;
    if (keys['KeyS']) fwd -= 1;
    if (keys['KeyD']) strafe += 1;
    if (keys['KeyA']) strafe -= 1;
  }

  const running = isMobile ? mobileRun : keys['ShiftLeft'];
  const speed = running ? 11 : 6.5;

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();
  const right = new THREE.Vector3();
  right.crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();

  const move = new THREE.Vector3();
  move.add(dir.multiplyScalar(fwd));
  move.add(right.multiplyScalar(strafe));
  if (move.length() > 1) move.normalize();

  if (move.length() > 0) {
    move.multiplyScalar(speed * dt);
    const newPos = camera.position.clone().add(move);
    let canX = true, canZ = true;
    for (const obs of obstacles) {
      if (newPos.x > obs.minX - 0.5 && newPos.x < obs.maxX + 0.5 &&
          camera.position.z > obs.minZ - 0.5 && camera.position.z < obs.maxZ + 0.5) canX = false;
      if (camera.position.x > obs.minX - 0.5 && camera.position.x < obs.maxX + 0.5 &&
          newPos.z > obs.minZ - 0.5 && newPos.z < obs.maxZ + 0.5) canZ = false;
    }
    if (canX) camera.position.x = newPos.x;
    if (canZ) camera.position.z = newPos.z;
  }

  if (keys['Space'] && player.onGround) {
    player.velocity.y = 6;
    player.onGround = false;
  }
  player.velocity.y -= 18 * dt;
  camera.position.y += player.velocity.y * dt;
  if (camera.position.y <= 1.7) {
    camera.position.y = 1.7;
    player.velocity.y = 0;
    player.onGround = true;
  }
  camera.position.x = Math.max(-arenaSize + 1, Math.min(arenaSize - 1, camera.position.x));
  camera.position.z = Math.max(-arenaSize + 1, Math.min(arenaSize - 1, camera.position.z));

  if (move.length() > 0 && player.onGround) {
    gunMesh.position.y = -0.2 + Math.sin(performance.now() * 0.01) * 0.015;
  } else {
    gunMesh.position.y = -0.2;
  }
}

function updateBullets(dt) {
  bullets = bullets.filter(b => {
    b.mesh.position.add(b.dir.multiplyScalar(70 * dt));
    b.life -= dt;
    if (b.life <= 0) { scene.remove(b.mesh); return false; }
    return true;
  });
}

// 桌面端鼠标视角
let yaw = 0, pitch = 0;
function onMouseMove(e) {
  if (document.pointerLockElement !== renderer.domElement) return;
  rotateView(e.movementX, e.movementY);
}

function updateHUD() {
  document.getElementById('score').textContent = player.score;
  document.getElementById('health-fill').style.width = Math.max(0, player.health) + '%';
  if (!player.reloading) {
    document.getElementById('ammo').textContent = player.ammo + '/' + player.maxAmmo;
  }
}

function showKillFeed(msg) {
  const feed = document.getElementById('kill-feed');
  const div = document.createElement('div');
  div.className = 'kill-msg';
  div.textContent = msg;
  feed.appendChild(div);
  setTimeout(() => div.remove(), 2000);
}

function startGame() {
  player.health = 100; player.score = 0; player.ammo = 30; player.reloading = false;
  kills = 0;
  camera.position.set(0, 1.7, 0);
  yaw = 0; pitch = 0;
  camera.rotation.set(0, 0, 0);
  enemies.forEach(e => scene.remove(e.mesh));
  enemies = [];
  bullets.forEach(b => scene.remove(b.mesh));
  bullets = [];
  for (let i = 0; i < 4; i++) spawnEnemy();
  gameRunning = true;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('crosshair').classList.remove('hidden');
  updateHUD();
  if (!isMobile) renderer.domElement.requestPointerLock();
}

function gameOver() {
  gameRunning = false;
  if (!isMobile) document.exitPointerLock();
  document.getElementById('final-score').textContent = player.score;
  document.getElementById('final-kills').textContent = kills;
  document.getElementById('game-over-screen').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('crosshair').classList.add('hidden');
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (gameRunning) {
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    if (enemies.length < 3 && Math.random() < 0.008) spawnEnemy();
  }
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
animate();
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
if (!isMobile) {
  renderer.domElement.addEventListener('click', () => {
    if (gameRunning && document.pointerLockElement !== renderer.domElement) {
      renderer.domElement.requestPointerLock();
    }
  });
}
</script>
</body>
</html>
